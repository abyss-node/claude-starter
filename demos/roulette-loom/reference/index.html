<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roulette Loom</title>
  <style>
    :root { color-scheme: light dark; --ink: #1f6f8b; --gear: #c0392b; --bg: #fbfaf7; --fg: #222; }
    @media (prefers-color-scheme: dark) { :root { --ink: #6fc3df; --gear: #ff7b6b; --bg: #15171a; --fg: #e8e6e3; } }
    body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    main { display: grid; gap: 1rem; padding: 1rem; max-width: 960px; margin: 0 auto; }
    h1 { margin: 0; font-size: 1.4rem; }
    .stage { position: relative; width: min(90vw, 640px); aspect-ratio: 1; }
    .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0.75rem; }
    label { display: grid; gap: 0.2rem; }
    output { font-variant-numeric: tabular-nums; }
    button { padding: 0.4rem 0.9rem; font: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Roulette Loom</h1>
    <form id="controls">
      <label>Ring radius R <output id="R-out"></output>
        <input id="R" type="range" min="2" max="120" step="1" value="96"></label>
      <label>Rolling radius r <output id="r-out"></output>
        <input id="r" type="range" min="1" max="119" step="1" value="35"></label>
      <label>Pen distance d <output id="d-out"></output>
        <input id="d" type="range" min="0" max="120" step="0.5" value="60"></label>
      <label>Speed <output id="speed-out"></output>
        <input id="speed" type="range" min="1" max="60" step="1" value="12"></label>
      <button id="play" type="button">Pause</button>
    </form>
    <p id="status" aria-live="polite"></p>
    <div class="stage">
      <canvas id="trail" width="1280" height="1280" aria-label="The curve the pen has drawn"></canvas>
      <canvas id="gear" width="1280" height="1280" aria-hidden="true"></canvas>
    </div>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
