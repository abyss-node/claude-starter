<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monster Tamer Lite</title>
  <style>
    :root { --bg: #14181f; --fg: #e8ecf1; --card: #222a36; --accent: #f0a030; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px; }
    h1 { margin: 0; font-size: 1.3rem; }
    canvas { background: #0c0f14; border: 2px solid var(--card); max-width: 100%; image-rendering: pixelated; }
    #modes, #menu { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    button { background: var(--card); color: var(--fg); border: 1px solid #3a4658; border-radius: 6px; padding: 8px 14px; font: inherit; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    #message { min-height: 3em; max-width: 520px; text-align: center; }
    #cover { display: none; position: fixed; inset: 0; background: #000; color: #fff; align-items: center; justify-content: center; flex-direction: column; gap: 16px; font-size: 1.4rem; text-align: center; padding: 24px; }
    #cover.on { display: flex; }
    label { font-size: 0.9rem; }
    input { width: 7em; background: var(--card); color: var(--fg); border: 1px solid #3a4658; border-radius: 4px; padding: 4px 6px; }
  </style>
</head>
<body>
  <h1>Monster Tamer Lite</h1>
  <div id="modes">
    <button id="mode-adventure">Adventure</button>
    <button id="mode-solo">Solo battle vs computer</button>
    <button id="mode-duel">Two players, one screen</button>
    <label>Seed <input id="seed" value="1" inputmode="numeric"></label>
    <button id="sound">Sound: off</button>
  </div>
  <canvas id="screen" width="480" height="288"></canvas>
  <div id="message">Pick a mode. Adventure: arrow keys or WASD to walk; tall grass hides creatures.</div>
  <div id="menu"></div>
  <div id="cover"><div id="cover-text"></div><button id="cover-ready">Ready</button></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
