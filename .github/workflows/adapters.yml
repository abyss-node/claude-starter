name: adapters

# Generated adapters must match their sources, the commit guard must pass its suite, and the
# OpenCode adapter must actually load in OpenCode. A hand translation once produced agent files
# that made OpenCode's whole config invalid while reporting success; this job is the check that
# would have caught it.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The scripts and the commit guard promise Python 3.9; a 3.10-only keyword once broke the failure
  # reporter on 3.9 while every test passed on 3.12. So both suites run on both ends of the supported range.
  # Pinned: ubuntu-latest moved to 26.04 in Oct 2026, which has no Python 3.9 build, and the
  # 3.9 job failed at setup before any test ran. 24.04 still carries 3.9.25.
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the version-bump test compares against the last release tag

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installer, adapter and report tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q scripts/tests

      - name: Commit-guard tests
        run: python -m pytest -q -rs plugins/starter/hooks/commit-guard/tests

  # The demos' held-out checks must bind: each reference solution passes its accept/, each skeleton fails it, and
  # a planted bug in a reference fails it; demos/tests also runs start, check and pick end to end, and
  # re-grades every run in demos/costs.json from its committed workspace before admitting it. They need Node,
  # which the scripts job does not have, so this job sets up the newest Node 22, the oldest supported LTS line
  # (22.13 or newer: demolib.NODE_FLOOR). Windows is in the matrix because a raw Windows path is not an import
  # specifier and npm runs `test` through cmd.exe there. One more leg runs at the floors, Python 3.9 and Node
  # 22.13.0 exactly (demolib.PY_FLOOR, NODE_FLOOR): 22.13's permission-model errors name no flag, and tests that
  # passed on the newest 22.x once failed there unseen. On ubuntu-24.04, as demo-mutants: 26.04 has no Python 3.9.
  demos:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
        node: ["22"]
        include:
          - os: ubuntu-24.04
            python: "3.9"
            node: "22.13.0"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # costs.json admits a run only when its kit_sha is on origin/main; the re-grade exports it

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Demo tests (Python, driving Node)
        shell: bash
        run: |
          node -e "const [a, b] = process.versions.node.split('.').map(Number); if (a !== 22 || b < 13) { console.error('expected Node 22.13 or newer 22.x, got ' + process.versions.node); process.exit(1) }"
          python -m pip install --quiet pytest
          python -m pytest -q -rs demos/tests

  # The demo names, for demo-mutants' matrix, so a demo added to demos/ is proved without editing this file.
  demo-list:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      demos: ${{ steps.list.outputs.demos }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - id: list
        run: echo "demos=$(python demos/mutants.py --list)" >> "$GITHUB_OUTPUT"

  # Each demo's fixed mutant list is what "done" means for its checks: the reference passes them, the skeleton
  # fails them, every mutant is killed and every legal variant passes, each graded exactly as a workspace is
  # (demos/mutants.py). It runs at the floors, Python 3.9 and Node 22.13.0 exactly (demolib.PY_FLOOR,
  # NODE_FLOOR), since every brief was written on newer ones; a check that needs a newer runtime fails here. On
  # ubuntu-24.04 for the reason the scripts job gives: 26.04 has no Python 3.9.
  demo-mutants:
    needs: demo-list
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        demo: ${{ fromJSON(needs.demo-list.outputs.demos) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"

      - name: The mutants of ${{ matrix.demo }} (reference PASS, skeleton FAIL, all killed)
        run: |
          python -c "import sys; assert sys.version_info[:2] == (3, 9), sys.version"
          node -e "if (process.versions.node !== '22.13.0') { console.error('expected Node 22.13.0, got ' + process.versions.node); process.exit(1) }"
          python demos/mutants.py "${{ matrix.demo }}" --jobs 4

  adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENCODE_VERSION: "1.19.5"
      CODEX_VERSION: "0.167.0"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Adapters match a fresh build
        run: python scripts/build_adapters.py --check

      - name: Install OpenCode
        run: |
          npm install --global "opencode-ai@${OPENCODE_VERSION}"
          test "$(opencode --version)" = "${OPENCODE_VERSION}"

      - name: Install the kit into a throwaway HOME
        run: |
          H="$RUNNER_TEMP/home"
          mkdir -p "$H"
          {
            echo "HOME=$H"
            echo "XDG_CONFIG_HOME=$H/.config"
            echo "XDG_DATA_HOME=$H/.local/share"
            echo "XDG_CACHE_HOME=$H/.cache"
            echo "XDG_STATE_HOME=$H/.local/state"
          } >> "$GITHUB_ENV"
          export HOME="$H" XDG_CONFIG_HOME="$H/.config" XDG_DATA_HOME="$H/.local/share" \
            XDG_CACHE_HOME="$H/.cache" XDG_STATE_HOME="$H/.local/state"
          opencode debug paths
          set -o pipefail
          python scripts/install.py --tool opencode --tier starter --yes --no-guard | tee install.txt
          grep -E "^load check +opencode +passed \(loaded by opencode\) version ${OPENCODE_VERSION}$" install.txt

      - name: OpenCode loads the agents, skills and commands
        working-directory: ${{ runner.temp }}
        run: |
          C="$XDG_CONFIG_HOME/opencode"
          opencode agent list > agents.txt
          for a in verifier code-reviewer consultant; do
            grep -qx "$a (subagent)" agents.txt || { echo "::error::agent $a not loaded"; cat agents.txt; exit 1; }
          done
          test "$(find "$C/skills" -name SKILL.md | wc -l)" -eq 4
          test -f "$C/commands/checkpoint.md"
          test -f "$C/commands/lanes.md"
          test -f "$C/commands/onboard.md"
          opencode debug skill | python -c '
          import json, sys
          names = {s["name"] for s in json.load(sys.stdin)}
          want = {"backend-build-guardrails", "frontend-build-guardrails", "data-pipeline-guardrails", "llm-app-guardrails"}
          assert want <= names, f"skills not loaded: {want - names}"
          print("skills loaded:", sorted(want))'
          opencode debug config | python -c '
          import json, sys
          cmds = set(json.load(sys.stdin).get("command") or {})
          assert {"checkpoint", "lanes", "onboard"} <= cmds, f"commands loaded: {cmds}"
          print("commands loaded:", sorted(cmds))'
          for a in verifier code-reviewer consultant; do
            opencode debug agent "$a" | python -c '
          import json, sys
          name, tools = sys.argv[1], json.load(sys.stdin)["tools"]
          off = ["edit", "write", "task"] + (["bash"] if name == "consultant" else [])
          on = [t for t in off if tools.get(t)]
          assert not on, f"{name}: should be off but enabled: {on}"
          print(name, "read-only as intended; off:", off)' "$a"
          done

      - name: Re-running the installer changes nothing
        run: |
          python scripts/install.py --tool opencode --tier starter --yes --no-guard | tee rerun.txt
          if grep -E '  (installed|merged|updated)$' rerun.txt; then
            echo "::error::second install run changed files"; exit 1
          fi
          test "$(grep -c 'BEGIN claude-starter rules' "$XDG_CONFIG_HOME/opencode/AGENTS.md")" -eq 1

      # `codex execpolicy check` is offline and needs no account. The installer's Codex load check
      # runs it on the installed rules: git status must be allowed; git push, git branch <name> and
      # ruff with --cache-dir (it writes a cache) must not.
      - name: Install Codex
        run: |
          npm install --global "@openai/codex@${CODEX_VERSION}"
          codex --version

      - name: Codex accepts the rules file (execpolicy)
        run: |
          export CODEX_HOME="$HOME/.codex"
          python scripts/install.py --tool codex --tier starter --yes --no-guard | tee codex.txt
          grep -q 'rules verified with `codex execpolicy`' codex.txt
          codex execpolicy check --rules "$CODEX_HOME/rules/claude-starter.rules" -- git status | grep -q '"decision":"allow"'
          for cmd in "git push" "git branch x" "ruff format --check --cache-dir x"; do
            # shellcheck disable=SC2086 # the command is split into words on purpose
            if codex execpolicy check --rules "$CODEX_HOME/rules/claude-starter.rules" -- $cmd | grep -q '"decision":"allow"'; then
              echo "::error::'$cmd' is allowed by the Codex rules"; exit 1
            fi
          done

  # OpenCode 2 (`@opencode/cli`) removed `agent list` and `debug agent|skill|config`, and the installer's
  # load check then failed every 2.x install after writing it. Here the check must pass on 2.x, and the
  # load-check tests run against the real binary; a skipped test fails the job, since a skip here
  # would mean the 2.x checks never ran.
  opencode-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENCODE_V2_VERSION: "2.3.0"
      OPENCODE_DISABLE_AUTOUPDATE: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install OpenCode 2
        run: |
          npm install --global "@opencode/cli@${OPENCODE_V2_VERSION}"
          test "$(opencode --version)" = "opencode v${OPENCODE_V2_VERSION}"

      - name: Install the kit into a throwaway HOME; the load check passes on 2.x and a re-run changes nothing
        shell: bash
        run: |
          H="$RUNNER_TEMP/home"
          mkdir -p "$H"
          export HOME="$H" XDG_CONFIG_HOME="$H/.config" XDG_DATA_HOME="$H/.local/share" \
            XDG_CACHE_HOME="$H/.cache" XDG_STATE_HOME="$H/.local/state"
          opencode debug paths
          python scripts/install.py --tool opencode --tier starter --yes --no-guard | tee install.txt
          grep -E "^load check +opencode +passed \(loaded by opencode\) version ${OPENCODE_V2_VERSION}$" install.txt
          python scripts/install.py --tool opencode --tier starter --yes --no-guard | tee rerun.txt
          if grep -E '  (installed|merged|updated)$' rerun.txt; then
            echo "::error::second install run changed files"; exit 1
          fi

      - name: Load-check tests against the real OpenCode 2
        shell: bash
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q -rs scripts/tests/test_opencode_check.py | tee pytest.txt
          if grep -q skipped pytest.txt; then
            echo "::error::a load-check test skipped with OpenCode 2 installed"; exit 1
          fi

  # An install made by an old release's installer must update in place with the current one, equal a
  # fresh install afterwards, keep the user's own text and, in a hooked repo, keep blocking secrets.
  # The installers at these tags write no install record, so this also covers adopting an install by
  # its BEGIN markers. --offline plans against the checked-out commit, so the job needs no remote.
  # .github/scripts/update_fixture.py holds the checks; the OpenCode rows also load the result in
  # OpenCode, and the Windows row runs the launcher where exec would lose the exit code.
  update:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OPENCODE_VERSION: "1.19.5"
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, from: v0.3.0, tool: opencode, hooked: ""}
          - {os: ubuntu-24.04, from: v0.3.1, tool: opencode, hooked: ""}
          - {os: ubuntu-24.04, from: v0.3.1, tool: junie, hooked: ""}
          - {os: ubuntu-24.04, from: v0.3.1, tool: junie, hooked: "--hooked"}
          - {os: windows-latest, from: v0.3.1, tool: junie, hooked: "--hooked"}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the default fetches no tags

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        if: matrix.tool == 'opencode'
        with:
          node-version: "22"

      - name: Install OpenCode
        if: matrix.tool == 'opencode'
        run: |
          npm install --global "opencode-ai@${OPENCODE_VERSION}"
          test "$(opencode --version)" = "${OPENCODE_VERSION}"

      - name: Install with the old release, update with this tree, compare with a fresh install
        shell: bash
        run: python .github/scripts/update_fixture.py --from "${{ matrix.from }}" --tool "${{ matrix.tool }}" --work "$RUNNER_TEMP/fixture" ${{ matrix.hooked }}

      - name: OpenCode loads the updated install
        if: matrix.tool == 'opencode'
        working-directory: ${{ runner.temp }}
        run: |
          export HOME="$UPDATED_HOME" XDG_CONFIG_HOME="$UPDATED_HOME/.config"
          export XDG_DATA_HOME="$UPDATED_HOME/.local/share" XDG_CACHE_HOME="$UPDATED_HOME/.cache"
          export XDG_STATE_HOME="$UPDATED_HOME/.local/state"
          opencode agent list > agents.txt
          for a in verifier code-reviewer consultant; do
            grep -qx "$a (subagent)" agents.txt || { echo "::error::agent $a not loaded"; cat agents.txt; exit 1; }
          done
          opencode debug config | python -c '
          import json, sys
          cmds = set(json.load(sys.stdin).get("command") or {})
          assert {"checkpoint", "lanes", "onboard", "starter-update"} <= cmds, f"commands loaded: {cmds}"
          print("commands loaded:", sorted(cmds))'

      - name: The launcher passes the installer's exit code through, and onboard runs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:HOME = "$env:RUNNER_TEMP\empty-home"; $env:USERPROFILE = $env:HOME
          New-Item -ItemType Directory -Force $env:HOME | Out-Null
          python scripts/starter.py update --offline
          if ($LASTEXITCODE -ne 2) { Write-Error "nothing installed: expected exit 2, got $LASTEXITCODE"; exit 1 }
          python scripts/starter.py update --offline --to not-a-sha
          if ($LASTEXITCODE -eq 0) { Write-Error "a bad --to exited 0"; exit 1 }
          # onboard under a home whose path holds an apostrophe, which misresolves ~ paths in Git Bash
          $env:HOME = "$env:RUNNER_TEMP\it's home"; $env:USERPROFILE = $env:HOME
          New-Item -ItemType Directory -Force $env:HOME | Out-Null
          python scripts/starter.py onboard 1
          if ($LASTEXITCODE -ne 2) { Write-Error "onboard with no record: expected exit 2, got $LASTEXITCODE"; exit 1 }
          $out = python scripts/starter.py onboard 1 --tool codex
          if ($LASTEXITCODE -ne 0) { Write-Error "onboard 1 --tool codex exited $LASTEXITCODE"; exit 1 }
          $last = $out | Select-Object -Last 1
          if ($last -ne 'Next: type `$onboard 2 --tool codex` to go on.') { Write-Error "onboard ended with: $last"; exit 1 }
          exit 0
